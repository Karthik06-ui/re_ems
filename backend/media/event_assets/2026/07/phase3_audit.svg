<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #444; }

    /* c-teal */
    .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .ts   { fill: #085041; }
    .c-teal .th   { fill: #04342C; }

    /* c-amber */
    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .ts  { fill: #633806; }
    .c-amber .th  { fill: #412402; }

    /* c-red */
    .c-red rect   { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red .ts    { fill: #791F1F; }
    .c-red .th    { fill: #501313; }

    /* legend swatches */
    .swatch-teal  { fill: #1D9E75; opacity: 0.85; }
    .swatch-red   { fill: #E24B4A; opacity: 0.85; }

    /* divider */
    .divider { stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 4 4; }

    /* summary labels */
    .summary-label { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .summary-sub   { font-size: 12px; fill: #444; }
  </style>
</defs>

<!-- Header -->
<text class="th" x="340" y="36" text-anchor="middle" font-size="16">Phase 3 — Audit: built vs missing</text>

<!-- Legend -->
<rect class="swatch-teal" x="430" y="18" width="14" height="14" rx="3"/>
<text class="ts" x="448" y="29">Done</text>
<rect class="swatch-red"  x="510" y="18" width="14" height="14" rx="3"/>
<text class="ts" x="528" y="29">Missing</text>

<!-- ── Step 1 ── -->
<text class="th" x="40" y="74">Step 1 — Authentication APIs</text>
<g class="c-teal"><rect x="40"  y="84" width="240" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52" y="108">POST /api/auth/register/  (student &amp; mentor)</text></g>
<g class="c-teal"><rect x="294" y="84" width="180" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="306" y="108">POST /api/auth/login/  (JWT)</text></g>

<!-- ── Step 2 ── -->
<text class="th" x="40" y="150">Step 2 — Profile APIs</text>
<g class="c-teal"><rect x="40"  y="160" width="230" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52" y="184">GET + PATCH /auth/profile/student/</text></g>
<g class="c-teal"><rect x="284" y="160" width="225" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="296" y="184">GET + PATCH /auth/profile/mentor/</text></g>

<!-- ── Step 3 ── -->
<text class="th" x="40" y="226">Step 3 — Project APIs</text>
<g class="c-teal"><rect x="40"  y="236" width="148" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52"  y="260">GET /api/projects/</text></g>
<g class="c-teal"><rect x="200" y="236" width="185" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="212" y="260">POST /api/projects/ (mentor)</text></g>
<g class="c-teal"><rect x="398" y="236" width="178" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="410" y="260">GET /api/projects/&lt;id&gt;/</text></g>
<g class="c-teal"><rect x="40"  y="284" width="220" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52"  y="308">POST /api/proposals/ (join req.)</text></g>

<!-- ── Step 4 ── -->
<text class="th" x="40" y="350">Step 4 — Proposal System</text>
<g class="c-teal"><rect x="40"  y="360" width="202" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52"  y="384">Submit proposal (student)</text></g>
<g class="c-teal"><rect x="254" y="360" width="210" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="266" y="384">Approve / reject (mentor)</text></g>
<g class="c-teal"><rect x="476" y="360" width="165" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="488" y="384">Auto-create enrollment</text></g>

<!-- ── Step 5 ── -->
<text class="th" x="40" y="430">Step 5 — Dashboard APIs</text>
<g class="c-amber"><rect x="40"  y="440" width="190" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52" y="464">Student dashboard  ⚠ partial</text></g>
<g class="c-amber"><rect x="244" y="440" width="190" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="256" y="464">Mentor dashboard  ⚠ partial</text></g>
<g class="c-red"><rect x="40"  y="490" width="180" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="52"  y="514">Tasks  — model + APIs</text></g>
<g class="c-red"><rect x="234" y="490" width="180" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="246" y="514">Reviews — model + APIs</text></g>
<g class="c-red"><rect x="428" y="490" width="180" height="38" rx="6" stroke-width="0.5"/>
  <text class="ts" x="440" y="514">Remarks — model + APIs</text></g>

<!-- Divider -->
<line class="divider" x1="40" y1="550" x2="640" y2="550"/>

<!-- Summary -->
<text class="th" x="40" y="576">Summary</text>
<g class="c-teal">
  <rect x="40"  y="588" width="170" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="125" y="610" text-anchor="middle">Steps 1–4</text>
  <text class="ts" x="125" y="628" text-anchor="middle">Fully complete ✓</text>
</g>
<g class="c-amber">
  <rect x="224" y="588" width="170" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="309" y="610" text-anchor="middle">Step 5 dashboards</text>
  <text class="ts" x="309" y="628" text-anchor="middle">Partially built</text>
</g>
<g class="c-red">
  <rect x="408" y="588" width="228" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="522" y="610" text-anchor="middle">Tasks / Reviews / Remarks</text>
  <text class="ts" x="522" y="628" text-anchor="middle">Not built — needs Phase 3.5</text>
</g>

<!-- Footer note -->
<text class="ts" x="340" y="680" text-anchor="middle">11 endpoints built  ·  ~9 new endpoints still needed  ·  3 new models to create</text>
</svg>
